[default_config]
version = "0.10.1"
assembler = "nasm"
instruction_set = "x86/x86-64"

[default_config.opts]
compiler = "nasm"
diagnostics = true
default_diagnostics = false

[[project]]
path = "0xAX"
assembler = "nasm"
instruction_set = "x86-64"

[project.opts]
compiler = "nasm"
compile_flags_txt = ["-f", "elf64"]
diagnostics = true
default_diagnostics = false

[[project]]
path = "src"
assembler = "nasm"
instruction_set = "x86"

[project.opts]
compiler = "nasm"
compile_flags_txt = ["-f", "elf32"]
diagnostics = true
default_diagnostics = false
